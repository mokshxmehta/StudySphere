<!DOCTYPE html>
<html lang="en">
<head>
    <title>StudySphere | Log In</title>
    <link rel="stylesheet" href="LogIn.css">
</head>
<body>
    <div class="outerbox">
        <div class="innerbox">
            <header class="signup-header">
                <h1>Log In</h1>
                <p>Fill the details to <strong> Log In </strong>to your account</p>
            </header>
            <main class="signup-body">
                <form action="#">
                   <div class="u">
                    <p>
                        <label for="fullname">Username <sup>*</sup></label>
                        <input type="text" id="fullname" placeholder="Username" required>
                    </p>
                </div>
                    <div class="p">
                    <p>
                        <label for="password">Password <sup>*</sup></label>
                        <input type="password" id="password" placeholder="Your password" required>
                    </p>
                </div>

                    <p>
                        <input type="submit" id="submit" value="Log In">
                    </p>
                </form>
            </main>
            <footer class="signup-footer">
                <p>Don't have an account? <a href="SignIn.html"> Sign In </a> </p>

            </footer>
        </div>
        <div class="circle C1"></div>
        <div class="circle C2"></div>
    </div>
</body>
</html>
