<!DOCTYPE html>
<html lang="en">
<head>
    <title>StudySphere | Sign In</title>
    <link rel="stylesheet" href="SignIn.css">
</head>
<body>
    <div class="outerbox">
        <div class="innerbox">
            <header class="signup-header">
                <h1>Sign Up</h1>
                <p>It Just takes 30 second to Sign up and create your account!</p>
            </header>
            <main class="signup-body">
                <form action="#">
                    <p>
                        <label for="fullname">Your Name <sup>*</sup></label>
                        <input type="text" id="fullname" placeholder="Your Name" required>
                    </p>

                    <p>
                        <label for="fullname">User Name <sup>*</sup></label>
                        <input type="text" id="fullname" placeholder="User Name" required>
                    </p>

                    <p>
                        <label for="email">Your Email <sup>*</sup></label>
                        <input type="email" id="email" placeholder="Your email" required>
                    </p>

                    <p>
                        <label for="password">New password <sup>*</sup></label>
                        <input type="password" id="password" placeholder="Atleast 8 characters" required>
                    </p>

                    <p>
                        <label for="password">Confirm Your password <sup>*</sup></label>
                        <input type="password" id="password" placeholder="Atleast 8 characters" required>
                    </p>

                    <p>
                        <input type="submit" id="submit" value="Create account">
                    </p>
                </form>
            </main>
            <footer class="signup-footer">
                <p>Already have an account? <a href="LogIn.html">Login</a></p>

            </footer>
        </div>
        <div class="circle C1"></div>
        <div class="circle C2"></div>
    </div>
</body>
</html>
